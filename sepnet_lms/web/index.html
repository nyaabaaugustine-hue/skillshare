<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Explicit viewport: the engine usually injects one, but relying on that
       leaves older builds and `flutter run -d chrome` at the 980px default.
       Zoom is deliberately left enabled for accessibility. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SkillBridge Academy — friendly Python learning for every learner.">

  <!-- iOS meta tags & icons. iOS ignores the web manifest for the home-screen
       icon and launch chrome, so these are not optional duplicates. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SkillBridge Academy">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1697F5">

  <!-- Favicon: a dedicated, simplified robot mark that stays crisp at 16-32px.
       The ?v= suffix makes browsers fetch the new icon instead of a cached one;
       bump it whenever the icon changes. -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">

  <title>SkillBridge Academy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    PWA service worker.

    Flutter 3.47 generates a `flutter_service_worker.js` that only unregisters
    itself, and its bootstrap registers that file only when a registration
    already exists. So: `tool/build_web.ps1` replaces the generated file with
    web/sw.js (the caching worker), and the page registers it here. Both point
    at the same file, so whichever registration wins runs the same code and
    the app is never left uncontrolled.

    Skipped on insecure origins (a browser refuses it anyway); a failure is
    swallowed because it must never stop the app from booting.
  -->
  <script>
    if (
      "serviceWorker" in navigator &&
      (location.protocol === "https:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1")
    ) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("flutter_service_worker.js", { scope: "./" })
          .catch(function () {});
      });
    }
  </script>
</body>
</html>
