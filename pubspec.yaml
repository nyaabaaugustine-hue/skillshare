name: skillbridge_python_lab
description: "SkillBridge Academy - an offline-first mobile Python coding and learning app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / dependency injection.
  provider: ^6.1.2

  # Local storage (offline-first drafts, submissions, exercise cache).
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  # Web build has no dart:ffi, so SQLite runs as wasm in a shared worker.
  # See lib/core/storage/database_factory_web.dart.
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Networking for the LMS integration layer.
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.2

  # Lightweight preferences (theme, editor settings).
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  crypto: ^3.0.6

  # Embedded CPython runtime for on-device execution (Android/iOS/desktop).
  # See docs/ADR_001_PYTHON_RUNTIME.md for the evaluation and rationale.
  serious_python: ^5.0.0
  supabase_flutter: ^2.18.3
  # Local learning reminders (daily + "you stopped halfway"). Pinned below the
  # versions that require Android SDK 37, which this project does not target.
  flutter_local_notifications: ^19.4.2
  # Scheduling needs a TZDateTime. The local zone is derived from the device
  # UTC offset in reminders_io.dart, which avoids a second plugin that clashed
  # with this project's Java 11 target.
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates the launcher icons for every platform from assets/icon/*.png
  # (run `python tool/make_app_icon.py` first, then
  # `dart run flutter_launcher_icons`).
  flutter_launcher_icons: ^0.14.4

# Premium robot app icon. Replaces the default Flutter icon on every platform.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # The foreground is already drawn inside Android's safe zone, so no extra
  # inset (the default 16% would shrink the robot a second time).
  adaptive_icon_foreground_inset: 0
  # Android 13+ "themed icons": a one-colour robot the system tints to match
  # the user's wallpaper.
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  # Web icons (favicon, PWA icons) come from `python tool/make_app_icon.py`,
  # which draws a dedicated simplified favicon. Letting this tool generate them
  # shrinks the detailed app icon to 16px, which looks muddy in a browser tab.
  web:
    generate: false
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/editor/
    - assets/course_previews/
    - assets/icon/app_icon.png
    # Transparent brand mark for in-app surfaces (white splash, certificate
    # seal, dark headers). Generated by tool/make_transparent_logo.py.
    - assets/icon/app_mark.png
    # The web (Pyodide) runtime fetches this executor via the Flutter asset
    # bundle at `assets/python_app/skillbridge_exec.py` (see
    # web/pyodide_worker.js). Android/iOS instead read it from the packaged
    # `app.zip`, and the packaging step strips __pycache__ with --cleanup-app,
    # so this directory must not contain stale bytecode.
    - python_app/
